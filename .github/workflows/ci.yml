name: CI Build

on:
  push:
    branches:
      - master
      - main
      - "codex/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Binary builds: Windows + Linux run simultaneously on every push/PR ──
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        env:
          PIP_PREFER_BINARY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # Windows-specific: native C compiler for PySide6/Nuitka.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Linux-specific: required system libs/tools for the PySide6/Nuitka build
      # (OpenGL/EGL/X11 libs used by Qt at build/bundle time, even though the
      # icon-sync script itself now only depends on Pillow). Package names are
      # valid on Ubuntu 24.04 (Noble): libegl1-mesa was removed in 24.04.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libegl1 \
            libgl1 \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libfontconfig1 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libgles2

      - name: Syntax / import smoke check
        shell: bash
        run: |
          python -m compileall -q src

      - name: Build Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: powershell -ExecutionPolicy Bypass -File ./scripts/build_nuitka.ps1 -Python python -OutputDir dist_nuitka -Compiler msvc

      - name: Build Nuitka (Linux)
        if: runner.os == 'Linux'
        env:
          PYTHON: python
        run: ./scripts/build_nuitka.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zapret-zen-ci-${{ runner.os }}
          path: dist_nuitka/main.dist/**
          if-no-files-found: error
