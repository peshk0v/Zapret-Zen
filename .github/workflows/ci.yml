name: CI Build

on:
  push:
    branches:
      - master
      - main
      - "codex/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Binary builds: Windows + Linux run simultaneously on every push/PR ──
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        env:
          PIP_PREFER_BINARY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      # Windows-specific: native C compiler for PySide6/Nuitka.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Linux-specific: required system libs/tools.
      - name: Install Linux system tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y file

      - name: Syntax / import smoke check
        shell: bash
        run: |
          python -m compileall -q src

      - name: Build Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: powershell -ExecutionPolicy Bypass -File ./scripts/build_nuitka.ps1 -Python python -OutputDir dist_nuitka -Compiler msvc

      - name: Build Nuitka (Linux)
        if: runner.os == 'Linux'
        env:
          PYTHON: python
        run: ./scripts/build_nuitka.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zapret-zen-ci-${{ runner.os }}
          path: dist_nuitka/main.dist/**
          if-no-files-found: error
